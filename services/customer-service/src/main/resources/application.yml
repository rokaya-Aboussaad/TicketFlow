spring:
  application:
    name: customer-service
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true