# TicketFlow - environnement complet : MySQL, Kafka, Eureka, Config Server, 6 microservices, Gateway

x-common-env: &common-env
  EUREKA_URL: http://discovery-server:8761/eureka/
  CONFIG_SERVER_URL: http://con-server:8888
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"

x-db-env: &db-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: ticketflow
  DB_PASSWORD: ticketflow

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  # ---------- Infrastructure ----------
  mysql:
    image: mysql:8.4
    container_name: ticketflow-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ticketflow
      MYSQL_PASSWORD: ticketflow
    ports:
      - "3310:3306" # 3310 sur la machine pour éviter un conflit avec XAMPP/MySQL local (3306, 3307)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: ticketflow-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------- Spring Cloud ----------
  discovery-server:
    build: { context: .., dockerfile: services/discovery-server/Dockerfile }
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    ports:
      - "8761:8761"
    restart: on-failure

  con-server:
    build: { context: .., dockerfile: services/con-server/Dockerfile }
    environment:
      CONFIG_REPO_PATH: /config
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    volumes:
      - ../../ticketflow-config:/config:ro
    ports:
      - "8888:8888"
    restart: on-failure

  # ---------- Microservices ----------
  customer-service:
    build: { context: .., dockerfile: services/customer-service/Dockerfile }
    environment:
      <<: [*common-env, *db-env]
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  event-service:
    build: { context: .., dockerfile: services/event-service/Dockerfile }
    environment:
      <<: [*common-env, *db-env]
    ports:
      - "8082:8082"
    depends_on:
      mysql: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  booking-service:
    build: { context: .., dockerfile: services/booking-service/Dockerfile }
    environment:
      <<: [*common-env, *db-env, *kafka-env]
    ports:
      - "8083:8083"
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  payment-service:
    build: { context: .., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: [*common-env, *db-env, *kafka-env]
    ports:
      - "8084:8084"
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  ticket-service:
    build: { context: .., dockerfile: services/ticket-service/Dockerfile }
    environment:
      <<: [*common-env, *db-env, *kafka-env]
    ports:
      - "8085:8085"
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  notification-service:
    build: { context: .., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: [*common-env, *kafka-env]
    ports:
      - "8086:8086"
    depends_on:
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

  api-gateway:
    build: { context: .., dockerfile: services/api-gateway/Dockerfile }
    environment:
      <<: *common-env
    ports:
      - "8080:8080"
    depends_on:
      discovery-server: { condition: service_started }
      con-server: { condition: service_started }
    restart: on-failure

volumes:
  mysql-data:
